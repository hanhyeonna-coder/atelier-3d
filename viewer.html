<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zombie Atelier</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="./styles/viewer.css"/>

</head>
<body>
<div id="app"></div>
<div id="loading"><div id="loadingMessage">Zombie Atelier</div></div>
<div id="timerPanel"><span id="workTimer">Today 0 min</span></div>
<div id="topActions">
  <button id="historyBtn">My Work</button>
  <button id="accountBtn" aria-label="My account" title="My account">👤</button>
</div>
<div id="controlHint"></div>
<div id="centerHint"></div>
<div id="statusToast"></div>
<input id="artUpload" type="file" accept="image/png,image/jpeg,image/webp" style="display:none"/>
<div id="artModal">
  <div id="artCard">
    <button id="artClose" aria-label="Close">×</button>
    <img id="artPreview" alt="Large artwork preview"/>
    <div id="artMeta"></div>
    <div id="artLikeRow"><button id="artLikeBtn" type="button"><span class="heart">♡</span><span class="label">Like</span><span class="count">0</span></button></div>
    <div id="artArchiveSection">
      <div id="artArchiveTitle">Finished works</div>
      <div id="artArchiveGrid"></div>
    </div>
  </div>
</div>
<div id="historyModal">
  <div id="historyCard">
    <button id="historyClose" aria-label="Close">×</button>
    <div id="currentProgressSection">
      <div id="historySummary">Current work in progress</div>
      <div id="historyGrid">
        <div id="progressStage">
          <div id="progressCarousel"></div>
          <div id="progressMeta"></div>
        </div>
      </div>
      <div id="progressActions">
        <button id="completeWorkBtn">Mark as finished</button>
        <button id="deleteCurrentWorkBtn">Discard this work</button>
      </div>
    </div>
    <div id="completedTitle">Finished works</div>
    <div id="completedGrid"></div>
  </div>
</div>
<div id="accountModal">
  <div id="accountCard">
    <button id="accountClose" aria-label="Close">×</button>
    <div id="accountTitle">My Zombie Atelier Account</div>
    <div id="accountDesc">Sign in with your email to keep the same artwork history across your phone and computer.</div>
    <input id="accountEmail" type="email" autocomplete="email" placeholder="Email address"/>
    <button id="accountAction">Email me a sign-in link</button>
    <button id="logoutBtn" style="display:none">Sign out</button>
    <div id="accountState"></div>
  </div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.119.0"
  }
}
</script>

<script type="module" src="./js/viewer.js"></script>

</body>
</html>
