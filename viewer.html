<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atelier 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e6ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe8df;z-index:20;font-weight:700;color:#4b3a30}
#hud{position:fixed;left:16px;top:16px;z-index:10;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);font-size:12px;color:#42362f;box-shadow:0 8px 28px rgba(0,0,0,.1);pointer-events:none}
#hud b{display:block;margin-bottom:5px}
#version{opacity:.45;font-size:10px;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">아틀리에 불러오는 중…</div>
<div id="hud">
  <b>Atelier</b>
  <div>클릭: 이동 · 드래그: 시점 · 휠: 줌 · WASD/방향키: 직접 이동</div>
  <div id="status">불러오는 중</div>
  <div id="version">controller v2.1</div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const loading=document.getElementById('loading');
const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd8e6ee);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.05,200);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;
document.getElementById('app').appendChild(renderer.domElement);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.38;

scene.add(new THREE.HemisphereLight(0xfff5e9,0x758797,.9));

const sun=new THREE.DirectionalLight(0xffddb5,2.15);
sun.position.set(-8,10,-4);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=.5;
sun.shadow.camera.far=35;
sun.shadow.camera.left=-9;
sun.shadow.camera.right=9;
sun.shadow.camera.top=9;
sun.shadow.camera.bottom=-9;
sun.shadow.bias=-.00035;
scene.add(sun);

const fill=new THREE.DirectionalLight(0xc6ddff,.35);
fill.position.set(6,5,5);
scene.add(fill);

const loader=new GLTFLoader();
const clock=new THREE.Clock();

let avatarRoot=null;
let avatarModel=null;
let avatarMixer=null;
const avatarActions={};
let currentAction=null;
let moveTarget=null;

let envMixer=null;
let boatMixer=null;

// Pavilion controller constants.
const WALK_RADIUS=5.35;
const CAMERA_RADIUS=5.85;
const MOVE_SPEED=1.85;
const MODEL_YAW_CORRECTION=-THREE.MathUtils.degToRad(97.005); // Blender/glTF front correction. Keep in one place.

// Camera orbit state. Completely independent from character facing.
let camYaw=0;
let camPitch=.92;
let camDistance=4.8;
let camTarget=new THREE.Vector3(0,1.05,-1.8);
let cameraFocus=new THREE.Vector3(0,1.05,-1.8);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

let pointerDown=false;
let dragged=false;
let downX=0,downY=0;
let lastX=0,lastY=0;

const keys=new Set();

function loadGLB(url){
  return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
}

function normalizeAvatarOrientation(model){
  // The exported rig has its own ~97° Y rotation.
  // Cancel that once at the model container level so movement yaw is clean.
  const rig=model.getObjectByName('AtelierAvatarRig');
  if(!rig)return;

  const q=rig.quaternion.clone();
  const e=new THREE.Euler().setFromQuaternion(q,'YXZ');
  model.rotation.y -= e.y;
  model.updateMatrixWorld(true);

  console.log('Avatar rig yaw cancelled:',THREE.MathUtils.radToDeg(e.y));
}

function normalizeAvatarOrigin(model){
  // Blender exported this avatar with a large scene-space offset.
  // Recenter the visible model inside avatarRoot without touching animation tracks.
  model.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const min=box.min.clone();

  // Put feet at local Y=0 and horizontal center at local X/Z=0.
  model.position.x-=center.x;
  model.position.z-=center.z;
  model.position.y-=min.y;

  model.updateMatrixWorld(true);

  console.log('Avatar origin normalized', {
    center:[center.x,center.y,center.z],
    minY:min.y
  });
}

function enhanceMaterials(root){
  root.traverse(o=>{
    if(!o.isMesh)return;

    const objectName=(o.name||'').toLowerCase();
    const mats=Array.isArray(o.material)?o.material:[o.material];

    o.castShadow=true;
    o.receiveShadow=true;

    mats.filter(Boolean).forEach(mat=>{
      const materialName=(mat.name||'').toLowerCase();
      const label=objectName+' '+materialName;

      const isGlass =
        label.includes('glass') ||
        label.includes('dome');

      const isWater =
        label.includes('water') ||
        label.includes('lake') ||
        label.includes('river');

      const isCanvas =
        label.includes('canvas') ||
        label.includes('painting') ||
        label.includes('picture') ||
        label.includes('artwork') ||
        label.includes('board');

      const isWood =
        label.includes('wood') ||
        label.includes('pillar') ||
        label.includes('column') ||
        label.includes('beam') ||
        label.includes('post') ||
        label.includes('frame') ||
        label.includes('roof beam');

      // --- GLASS / DOME ---
      if(isGlass){
        mat.transparent=true;
        mat.opacity=0.24;
        mat.depthWrite=false;
        mat.depthTest=true;
        mat.side=THREE.DoubleSide;

        if('color' in mat) mat.color.set('#eef8ff');
        if('roughness' in mat) mat.roughness=0.10;
        if('metalness' in mat) mat.metalness=0.0;
        if('transmission' in mat) mat.transmission=0.92;
        if('thickness' in mat) mat.thickness=0.28;
        if('ior' in mat) mat.ior=1.45;
        if('clearcoat' in mat) mat.clearcoat=1.0;
        if('clearcoatRoughness' in mat) mat.clearcoatRoughness=0.08;
        if('envMapIntensity' in mat) mat.envMapIntensity=1.35;

        o.castShadow=false;
        o.receiveShadow=false;
        mat.needsUpdate=true;
        return;
      }

      // --- WATER ---
      if(isWater){
        mat.transparent=true;
        mat.opacity=0.92;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.side=THREE.DoubleSide;

        if('color' in mat) mat.color.set('#6faec7');
        if('roughness' in mat) mat.roughness=0.18;
        if('metalness' in mat) mat.metalness=0.02;
        if('transmission' in mat) mat.transmission=0.10;
        if('clearcoat' in mat) mat.clearcoat=0.75;
        if('clearcoatRoughness' in mat) mat.clearcoatRoughness=0.16;
        if('envMapIntensity' in mat) mat.envMapIntensity=1.25;

        // If Blender exported a normal map, animate it subtly.
        if(mat.normalMap){
          mat.normalMap.wrapS=THREE.RepeatWrapping;
          mat.normalMap.wrapT=THREE.RepeatWrapping;
          mat.normalMap.repeat.set(3,3);
          o.userData.waterMaterial=mat;
        }

        o.castShadow=false;
        o.receiveShadow=true;
        mat.needsUpdate=true;
        return;
      }

      // --- CANVAS / PAINTING SURFACE ---
      if(isCanvas){
        mat.transparent=false;
        mat.opacity=1;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.side=THREE.DoubleSide;
        mat.alphaTest=0;

        if('color' in mat) mat.color.set('#f6f3eb');
        if('roughness' in mat) mat.roughness=0.92;
        if('metalness' in mat) mat.metalness=0;

        // Reduce z-fighting / rear-stick bleed on the white canvas.
        mat.polygonOffset=true;
        mat.polygonOffsetFactor=-2;
        mat.polygonOffsetUnits=-2;

        o.receiveShadow=false;
        o.renderOrder=5;
        mat.needsUpdate=true;
        return;
      }

      // --- WOOD / STRUCTURE ---
      if(isWood){
        mat.transparent=false;
        mat.opacity=1;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.alphaTest=0;
        mat.side=THREE.FrontSide;

        if('transmission' in mat) mat.transmission=0;
        if('roughness' in mat) mat.roughness=Math.max(mat.roughness ?? 0.45,0.42);
        if('metalness' in mat) mat.metalness=0;
        if('envMapIntensity' in mat) mat.envMapIntensity=0.35;

        o.castShadow=true;
        o.receiveShadow=true;
        mat.needsUpdate=true;
        return;
      }

      // Default opaque objects.
      if('envMapIntensity' in mat){
        mat.envMapIntensity=Math.max(mat.envMapIntensity||0,0.28);
      }
    });
  });
}

function correctBoatClip(sourceClip){
  const clip=sourceClip.clone();

  // The exported boat root loops around X ±15 / Z ±10.8,
  // while the boat mesh has a large local Z offset.
  // Expand the path so no part of the boat intersects the pavilion floor.
  for(const track of clip.tracks){
    if(!track.name.endsWith('.position'))continue;

    const values=track.values;
    for(let i=0;i<values.length;i+=3){
      values[i]   *= 1.42;  // X: push route outward
      values[i+1] -= 0.18;  // Y: keep boat slightly lower on water
      values[i+2] *= 1.42;  // Z: push route outward
    }
  }

  return clip;
}

function playAvatar(name,fade=.12){
  const next=avatarActions[name];
  if(!next)return;

  if(currentAction===next){
    if(!next.isRunning())next.reset().play();
    return;
  }

  next.enabled=true;
  next.clampWhenFinished=false;
  next.setLoop(THREE.LoopRepeat,Infinity);
  next.reset().play();

  if(currentAction)currentAction.crossFadeTo(next,fade,false);
  currentAction=next;
  status.textContent=name;
}

function setAvatarFacing(dir){
  // Rotate the OUTER group, not the animated GLB itself.
  // This prevents animation tracks from fighting the movement direction.
  avatarRoot.rotation.y=Math.atan2(dir.x,dir.z)+MODEL_YAW_CORRECTION;
}

function clampXZ(v,radius){
  const r=Math.hypot(v.x,v.z);
  if(r>radius){
    const s=radius/r;
    v.x*=s;
    v.z*=s;
  }
  return v;
}

function updateCamera(){
  if(!avatarRoot)return;

  const avatarFocus=new THREE.Vector3(
    avatarRoot.position.x,
    avatarRoot.position.y+1.15,
    avatarRoot.position.z
  );

  // Loose follow. Camera orientation never changes because of movement.
  const dx=avatarFocus.x-cameraFocus.x;
  const dz=avatarFocus.z-cameraFocus.z;
  const dist=Math.hypot(dx,dz);
  const DEAD_ZONE=1.45;

  if(dist>DEAD_ZONE){
    const excess=dist-DEAD_ZONE;
    cameraFocus.x += (dx/dist)*excess;
    cameraFocus.z += (dz/dist)*excess;
  }

  cameraFocus.y=1.15;
  camTarget.copy(cameraFocus);

  const horizontalDir=new THREE.Vector2(Math.sin(camYaw),Math.cos(camYaw)).normalize();

  // Preserve camera angle while keeping camera inside pavilion.
  // Solve ray-circle intersection from camera focus along view offset.
  const fx=camTarget.x, fz=camTarget.z;
  const dx2=horizontalDir.x, dz2=horizontalDir.y;
  const b=2*(fx*dx2+fz*dz2);
  const cc=fx*fx+fz*fz-CAMERA_RADIUS*CAMERA_RADIUS;
  const disc=Math.max(0,b*b-4*cc);
  const maxHorizontal=(-b+Math.sqrt(disc))/2;

  const requestedHorizontal=Math.cos(camPitch)*camDistance;
  const horizontal=Math.max(.35,Math.min(requestedHorizontal,maxHorizontal-.08));

  const desired=new THREE.Vector3(
    camTarget.x+dx2*horizontal,
    camTarget.y+Math.sin(camPitch)*camDistance,
    camTarget.z+dz2*horizontal
  );

  desired.y=THREE.MathUtils.clamp(desired.y,1.25,4.45);

  camera.position.copy(desired);
  camera.lookAt(camTarget);
}

function setClickTarget(clientX,clientY){
  if(!avatarRoot)return;

  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hit=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(groundPlane,hit))return;

  // Ignore clicks outside pavilion instead of snapping to outer edge.
  if(Math.hypot(hit.x,hit.z)>WALK_RADIUS){
    status.textContent='파빌리온 안쪽 바닥을 클릭해 주세요';
    return;
  }

  moveTarget=new THREE.Vector3(hit.x,avatarRoot.position.y,hit.z);
  playAvatar('Avatar_Walk');
  status.textContent='이동 중 → '+hit.x.toFixed(1)+', '+hit.z.toFixed(1);
}

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  pointerDown=true;
  dragged=false;
  downX=lastX=e.clientX;
  downY=lastY=e.clientY;
  renderer.domElement.setPointerCapture?.(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!pointerDown)return;

  const total=Math.hypot(e.clientX-downX,e.clientY-downY);
  if(total>7)dragged=true;

  if(dragged){
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    camYaw-=dx*.006;
    camPitch=THREE.MathUtils.clamp(camPitch+dy*.004,.42,1.16);
  }

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',e=>{
  if(e.button!==0)return;

  if(pointerDown&&!dragged){
    setClickTarget(e.clientX,e.clientY);
  }

  pointerDown=false;
  renderer.domElement.releasePointerCapture?.(e.pointerId);
});

renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  camDistance=THREE.MathUtils.clamp(camDistance+e.deltaY*.006,1.8,7.2);
  camera.fov=THREE.MathUtils.clamp(camera.fov+e.deltaY*.018,32,68);
  camera.updateProjectionMatrix();
},{passive:false});

addEventListener('keydown',e=>{
  if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
    keys.add(e.code);
    e.preventDefault();
  }
});
addEventListener('keyup',e=>keys.delete(e.code));

function updateMovement(dt){
  if(!avatarRoot)return;

  const f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  const s=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);

  const dir=new THREE.Vector3();
  let manual=!!(f||s);

  if(manual){
    moveTarget=null;

    // Camera-relative controls from the ACTUAL rendered camera.
    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

    dir.addScaledVector(forward,f);
    dir.addScaledVector(right,s);
    if(dir.lengthSq()>0)dir.normalize();
  }else if(moveTarget){
    dir.copy(moveTarget).sub(avatarRoot.position);
    dir.y=0;

    const distance=dir.length();
    if(distance<.09){
      avatarRoot.position.x=moveTarget.x;
      avatarRoot.position.z=moveTarget.z;
      moveTarget=null;
      playAvatar('Avatar_Idle');
      return;
    }

    dir.normalize();
  }else{
    if(currentAction===avatarActions['Avatar_Walk'])playAvatar('Avatar_Idle');
    return;
  }

  setAvatarFacing(dir);

  let step=MOVE_SPEED*dt;
  if(moveTarget){
    const remaining=avatarRoot.position.distanceTo(moveTarget);
    step=Math.min(step,remaining);
  }

  const next=avatarRoot.position.clone().addScaledVector(dir,step);
  clampXZ(next,WALK_RADIUS);
  avatarRoot.position.copy(next);

  playAvatar('Avatar_Walk');
}

Promise.all([
  loadGLB('./models/atelier_environment_web.glb'),
  loadGLB('./models/avatar_01.glb'),
  loadGLB('./models/atelier_furniture.glb').catch(()=>null),
  loadGLB('./models/atelier_upper_lower_flower.glb').catch(()=>null),
  loadGLB('./models/atelier_boat.glb').catch(()=>null)
]).then(([envGLB,avGLB,furnitureGLB,flowerGLB,boatGLB])=>{
  enhanceMaterials(envGLB.scene);
  scene.add(envGLB.scene);

  if(envGLB.animations?.length){
    envMixer=new THREE.AnimationMixer(envGLB.scene);
    envGLB.animations.forEach(clip=>{
      const a=envMixer.clipAction(clip);
      a.setLoop(THREE.LoopRepeat,Infinity);
      a.play();
    });
  }

  if(furnitureGLB){
    enhanceMaterials(furnitureGLB.scene);
    scene.add(furnitureGLB.scene);
  }

  if(flowerGLB){
    enhanceMaterials(flowerGLB.scene);
    scene.add(flowerGLB.scene);
  }

  if(boatGLB){
    enhanceMaterials(boatGLB.scene);
    scene.add(boatGLB.scene);

    if(boatGLB.animations?.length){
      boatMixer=new THREE.AnimationMixer(boatGLB.scene);
      boatMixer.timeScale=1/3;
      boatGLB.animations.forEach(sourceClip=>{
        const clip=correctBoatClip(sourceClip);
        const a=boatMixer.clipAction(clip);
        a.setLoop(THREE.LoopRepeat,Infinity);
        a.play();
      });
    }
  }

  // Outer transform group controls movement/facing.
  avatarRoot=new THREE.Group();
  avatarRoot.position.set(0,0,-2.35);
  scene.add(avatarRoot);

  avatarModel=avGLB.scene;
  enhanceMaterials(avatarModel);
  avatarRoot.add(avatarModel);
  normalizeAvatarOrigin(avatarModel);

  avatarMixer=new THREE.AnimationMixer(avatarModel);
  avGLB.animations.forEach(clip=>{
    avatarActions[clip.name]=avatarMixer.clipAction(clip);
  });

  playAvatar('Avatar_Idle',0);

  cameraFocus.set(
    avatarRoot.position.x,
    avatarRoot.position.y+1.15,
    avatarRoot.position.z
  );
  camTarget.copy(cameraFocus);
  updateCamera();

  loading.style.display='none';
  status.textContent='준비됨';
}).catch(err=>{
  console.error(err);
  loading.textContent='GLB 로드 실패';
  status.textContent=String(err);
});

function tick(){
  requestAnimationFrame(tick);

  const dt=Math.min(clock.getDelta(),.05);

  if(avatarMixer)avatarMixer.update(dt);
  if(envMixer)envMixer.update(dt);
  if(boatMixer)boatMixer.update(dt);

  // Subtle water movement when a normal map exists.
  scene.traverse(o=>{
    const waterMaterial=o.userData?.waterMaterial;
    if(waterMaterial?.normalMap){
      waterMaterial.normalMap.offset.x=(waterMaterial.normalMap.offset.x+dt*0.012)%1;
      waterMaterial.normalMap.offset.y=(waterMaterial.normalMap.offset.y+dt*0.007)%1;
    }
  });

  updateMovement(dt);
  updateCamera();

  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
