<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const loading=document.getElementById('loading');
const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd8e6ee);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.05,200);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;
document.getElementById('app').appendChild(renderer.domElement);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.38;

scene.add(new THREE.HemisphereLight(0xfff5e9,0x758797,1.08));

const sun=new THREE.DirectionalLight(0xffddb5,1.72);
sun.position.set(-8,10,-4);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=.5;
sun.shadow.camera.far=35;
sun.shadow.camera.left=-9;
sun.shadow.camera.right=9;
sun.shadow.camera.top=9;
sun.shadow.camera.bottom=-9;
sun.shadow.bias=-.00035;

const fill=new THREE.DirectionalLight(0xc6ddff,.35);
fill.position.set(6,5,5);

const loader=new GLTFLoader();
const clock=new THREE.Clock();

let avatarRoot=null;
let avatarModel=null;
let avatarMixer=null;
const avatarActions={};
let currentAction=null;
let moveTarget=null;

// NPC atelier residents.
const npcs=[];
const seatSlots=[];
const NPC_COUNT=4;
const NPC_MIN_DISTANCE=0.78;
const NPC_HAT_COLORS=[
  0x9b4c43, // brick
  0x6d4a91, // violet
  0xd59c35, // ochre
  0x4f7659, // green
  0x356d8c, // blue
  0x934d60, // wine
  0xb86f45, // terracotta
  0x596b9a  // indigo
];

let envMixer=null;
let boatMixer=null;
let boatMover=null;
let boatPrevPos=new THREE.Vector3();
let boatHasPrev=false;

// Pavilion controller constants.
const WALK_RADIUS=8.05;
const CAMERA_RADIUS=8.55;
const MOVE_SPEED=1.85;
const MODEL_YAW_CORRECTION=-THREE.MathUtils.degToRad(97.005); // Blender/glTF front correction. Keep in one place.

// Camera orbit state. Completely independent from character facing.
let camYaw=0;
let camPitch=.92;
let camDistance=4.8;
let camTarget=new THREE.Vector3(0,1.05,-1.8);
let cameraFocus=new THREE.Vector3(0,1.05,-1.8);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

let pointerDown=false;
let dragged=false;
let downX=0,downY=0;
let lastX=0,lastY=0;

const keys=new Set();

function loadGLB(url){
  return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
}

function normalizeAvatarOrientation(model){
  // The exported rig has its own ~97° Y rotation.
  // Cancel that once at the model container level so movement yaw is clean.
  const rig=model.getObjectByName('AtelierAvatarRig');
  if(!rig)return;

  const q=rig.quaternion.clone();
  const e=new THREE.Euler().setFromQuaternion(q,'YXZ');
  model.rotation.y -= e.y;
  model.updateMatrixWorld(true);

  console.log('Avatar rig yaw cancelled:',THREE.MathUtils.radToDeg(e.y));
}

function normalizeAvatarOrigin(model){
  // Blender exported this avatar with a large scene-space offset.
  // Recenter the visible model inside avatarRoot without touching animation tracks.
  model.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const min=box.min.clone();

  // Put feet at local Y=0 and horizontal center at local X/Z=0.
  model.position.x-=center.x;
  model.position.z-=center.z;
  model.position.y-=min.y;

  model.updateMatrixWorld(true);

  console.log('Avatar origin normalized', {
    center:[center.x,center.y,center.z],
    minY:min.y
  });
}

function enhanceMaterials(root){
  root.traverse(o=>{
    if(!o.isMesh)return;

    const objectName=(o.name||'').toLowerCase();
    const mats=Array.isArray(o.material)?o.material:[o.material];

    o.castShadow=true;
    o.receiveShadow=true;

    mats.filter(Boolean).forEach((mat,index)=>{
      const materialName=(mat.name||'').toLowerCase();

      // Exact classifications from the exported GLB.
      const isGlass =
        materialName==='glass' ||
        objectName==='glass dome';

      const isWater =
        materialName==='ext water' ||
        objectName==='ext water surface';

      const isCanvas =
        materialName==='canvas' ||
        objectName.includes('canvas');

      const isStructureWood =
        materialName==='warm oak' ||
        materialName==='ext dark wood' ||
        objectName.startsWith('column ') ||
        objectName.startsWith('roof beam ') ||
        objectName.includes('rear support') ||
        objectName.includes('easel');

      // GLASS: subtle clear greenhouse glass, not a foggy overlay.
      if(isGlass){
        const glass=new THREE.MeshPhysicalMaterial({
          name:'Atelier Clear Glass',
          color:new THREE.Color('#f4fbff'),
          transparent:true,
          opacity:0.10,
          transmission:0.22,
          roughness:0.07,
          metalness:0,
          ior:1.45,
          thickness:0.08,
          clearcoat:1,
          clearcoatRoughness:0.05,
          envMapIntensity:0.85,
          side:THREE.DoubleSide,
          depthWrite:false,
          depthTest:true
        });

        if(Array.isArray(o.material)){
          o.material[index]=glass;
        }else{
          o.material=glass;
        }

        o.castShadow=false;
        o.receiveShadow=false;
        return;
      }

      // WATER: exact exported water only.
      if(isWater){
        mat.transparent=true;
        mat.opacity=0.96;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.side=THREE.DoubleSide;

        if('color' in mat)mat.color.set('#69abc6');
        if('roughness' in mat)mat.roughness=0.12;
        if('metalness' in mat)mat.metalness=0.02;
        if('clearcoat' in mat)mat.clearcoat=1;
        if('clearcoatRoughness' in mat)mat.clearcoatRoughness=0.1;
        if('envMapIntensity' in mat)mat.envMapIntensity=1.35;

        o.castShadow=false;
        o.receiveShadow=true;
        mat.needsUpdate=true;
        return;
      }

      // CANVAS: fully opaque white board.
      if(isCanvas){
        mat.transparent=false;
        mat.opacity=1;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.alphaTest=0;
        mat.side=THREE.FrontSide;

        if('color' in mat)mat.color.set('#f7f4ec');
        if('roughness' in mat)mat.roughness=0.96;
        if('metalness' in mat)mat.metalness=0;

        mat.polygonOffset=true;
        mat.polygonOffsetFactor=-2;
        mat.polygonOffsetUnits=-2;

        o.receiveShadow=false;
        o.renderOrder=5;
        mat.needsUpdate=true;
        return;
      }

      // STRUCTURAL WOOD: columns, beams, easels must never be transparent.
      if(isStructureWood){
        mat.transparent=false;
        mat.opacity=1;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.alphaTest=0;
        mat.side=THREE.FrontSide;

        if('transmission' in mat)mat.transmission=0;
        if('roughness' in mat)mat.roughness=Math.max(mat.roughness ?? 0.45,0.45);
        if('metalness' in mat)mat.metalness=0;
        if('envMapIntensity' in mat)mat.envMapIntensity=0.28;

        o.castShadow=true;
        o.receiveShadow=true;
        mat.needsUpdate=true;
        return;
      }

      if('envMapIntensity' in mat){
        mat.envMapIntensity=Math.max(mat.envMapIntensity||0,0.25);
      }
    });
  });
}

function correctBoatClip(sourceClip){
  const clip=sourceClip.clone();

  // The exported boat root loops around X ±15 / Z ±10.8,
  // while the boat mesh has a large local Z offset.
  // Expand the path so no part of the boat intersects the pavilion floor.
  for(const track of clip.tracks){
    if(!track.name.endsWith('.position'))continue;

    const values=track.values;
    for(let i=0;i<values.length;i+=3){
      values[i]   *= 1.42;  // X: push route outward
      values[i+1] -= 0.18;  // Y: keep boat slightly lower on water
      values[i+2] *= 1.42;  // Z: push route outward
    }
  }

  return clip;
}

function playAvatar(name,fade=.12){
  const next=avatarActions[name];
  if(!next)return;

  if(currentAction===next){
    if(!next.isRunning())next.reset().play();
    return;
  }

  next.enabled=true;
  next.clampWhenFinished=false;
  next.setLoop(THREE.LoopRepeat,Infinity);
  next.reset().play();

  if(currentAction)currentAction.crossFadeTo(next,fade,false);
  currentAction=next;
  status.textContent=name;
}

function setAvatarFacing(dir){
  // Rotate the OUTER group, not the animated GLB itself.
  // This prevents animation tracks from fighting the movement direction.
  avatarRoot.rotation.y=Math.atan2(dir.x,dir.z)+MODEL_YAW_CORRECTION;
}

function clampXZ(v,radius){
  const r=Math.hypot(v.x,v.z);
  if(r>radius){
    const s=radius/r;
    v.x*=s;
    v.z*=s;
  }
  return v;
}

function recolorBeret(model,color){
  model.traverse(o=>{
    if(!o.isMesh)return;
    const on=(o.name||'').toLowerCase();
    const mats=Array.isArray(o.material)?o.material:[o.material];

    mats.forEach((mat,index)=>{
      if(!mat)return;
      const mn=(mat.name||'').toLowerCase();
      if(!(on.includes('beret')||on.includes('hat')||mn.includes('beret')||mn.includes('hat')))return;

      const cloned=mat.clone();
      if(cloned.color)cloned.color.setHex(color);
      cloned.needsUpdate=true;

      if(Array.isArray(o.material)){
        const arr=o.material.slice();
        arr[index]=cloned;
        o.material=arr;
      }else{
        o.material=cloned;
      }
    });
  });
}

function collectSeatSlots(furnitureRoot){
  seatSlots.length=0;

  const stoolRoots=[];
  furnitureRoot.traverse(o=>{
    const n=(o.name||'').toLowerCase();
    if(!(n.includes('stool_group')||n.startsWith('stool')))return;

    // Keep only the highest stool-labelled object so child meshes are not duplicated.
    let p=o.parent;
    while(p){
      const pn=(p.name||'').toLowerCase();
      if(pn.includes('stool_group')||pn.startsWith('stool'))return;
      p=p.parent;
    }
    stoolRoots.push(o);
  });

  const easels=[];
  furnitureRoot.traverse(o=>{
    const n=(o.name||'').toLowerCase();
    if(!n.startsWith('easel'))return;
    let p=o.parent;
    while(p){
      if((p.name||'').toLowerCase().startsWith('easel'))return;
      p=p.parent;
    }
    const box=new THREE.Box3().setFromObject(o);
    if(!box.isEmpty())easels.push({o,center:box.getCenter(new THREE.Vector3())});
  });

  stoolRoots.forEach((stool,index)=>{
    const box=new THREE.Box3().setFromObject(stool);
    if(box.isEmpty())return;

    const center=box.getCenter(new THREE.Vector3());
    let nearest=null;
    let nearestD=Infinity;

    easels.forEach(e=>{
      const d=(e.center.x-center.x)**2+(e.center.z-center.z)**2;
      if(d<nearestD){nearestD=d;nearest=e;}
    });

    const faceDir=nearest
      ? new THREE.Vector3(nearest.center.x-center.x,0,nearest.center.z-center.z).normalize()
      : new THREE.Vector3(-center.x,0,-center.z).normalize();

    // Avatar root stays on the floor; Avatar_Sit provides the seated body pose.
    const floorY=avatarRoot?.position.y ?? 0;
    seatSlots.push({
      index,
      stool,
      position:new THREE.Vector3(center.x,floorY,center.z),
      seatTop:box.max.y,
      faceDir,
      occupiedBy:null
    });
  });

  seatSlots.sort((a,b)=>Math.atan2(a.position.x,a.position.z)-Math.atan2(b.position.x,b.position.z));
  console.log('Seat slots:',seatSlots.length,seatSlots.map(s=>[s.position.x.toFixed(2),s.position.z.toFixed(2)]));
}

function makeNPCActionSet(model,clips){
  const mixer=new THREE.AnimationMixer(model);
  const actions={};
  clips.forEach(clip=>actions[clip.name]=mixer.clipAction(clip));
  return {mixer,actions,current:null};
}

function playNPC(npc,name,fade=.14){
  const next=npc.actions[name];
  if(!next)return;

  if(npc.current===next){
    if(!next.isRunning())next.reset().play();
    return;
  }

  next.enabled=true;
  next.clampWhenFinished=false;
  next.setLoop(THREE.LoopRepeat,Infinity);
  next.reset().play();
  if(npc.current)npc.current.crossFadeTo(next,fade,false);
  npc.current=next;
}

function randomWalkTarget(exceptNPC=null){
  for(let tries=0;tries<40;tries++){
    // Keep walkers clear of the center table and the pavilion wall.
    const radius=THREE.MathUtils.lerp(2.45,7.25,Math.sqrt(Math.random()));
    const a=Math.random()*Math.PI*2;
    const p=new THREE.Vector3(Math.sin(a)*radius,0,Math.cos(a)*radius);

    let blocked=false;
    for(const n of npcs){
      if(n===exceptNPC)continue;
      if(n.root.position.distanceTo(p)<1.25){blocked=true;break;}
    }
    if(!blocked&&avatarRoot&&avatarRoot.position.distanceTo(p)<1.1)blocked=true;
    if(!blocked)return p;
  }
  return new THREE.Vector3(3.2,0,0);
}

function releaseSeat(npc){
  if(npc.seat){
    if(npc.seat.occupiedBy===npc)npc.seat.occupiedBy=null;
    npc.seat=null;
  }
}

function reserveRandomSeat(npc){
  const free=seatSlots.filter(s=>!s.occupiedBy);
  if(!free.length)return false;
  const seat=free[Math.floor(Math.random()*free.length)];
  seat.occupiedBy=npc;
  npc.seat=seat;
  npc.target=seat.position.clone();
  npc.state='goingToSeat';
  playNPC(npc,'Avatar_Walk');
  return true;
}

function placeNPCSeated(npc,seat){
  seat.occupiedBy=npc;
  npc.seat=seat;
  npc.root.position.copy(seat.position);
  npc.root.rotation.y=Math.atan2(seat.faceDir.x,seat.faceDir.z)+MODEL_YAW_CORRECTION;
  npc.state='seated';
  npc.stateUntil=performance.now()/1000+THREE.MathUtils.randFloat(7,15);
  playNPC(npc,'Avatar_Sit',0);
}

function spawnNPCs(baseModel,clips,count=NPC_COUNT){
  npcs.splice(0,npcs.length);

  for(let i=0;i<count;i++){
    const root=new THREE.Group();
    const model=SkeletonUtils.clone(baseModel);
    root.add(model);

    const {mixer,actions,current}=makeNPCActionSet(model,clips);
    const npc={
      id:i,
      root,
      model,
      mixer,
      actions,
      current,
      state:'idle',
      stateUntil:0,
      target:null,
      seat:null,
      speed:THREE.MathUtils.randFloat(1.0,1.45)
    };

    // Shuffle-like random pick without repeating a hat color in this room.
    const usedColors=new Set(npcs.map(n=>n.hatColor));
    const availableColors=NPC_HAT_COLORS.filter(color=>!usedColors.has(color));
    const color=(availableColors.length?availableColors:NPC_HAT_COLORS)[Math.floor(Math.random()*(availableColors.length||NPC_HAT_COLORS.length))];
    npc.hatColor=color;
    recolorBeret(model,color);

    root.position.copy(randomWalkTarget(npc));
    scene.add(root);
    npcs.push(npc);
    playNPC(npc,'Avatar_Idle',0);
  }

  // Make the room immediately feel occupied: two residents begin seated,
  // the rest start at separated roaming locations.
  const freeSeats=seatSlots.slice();
  for(let i=0;i<Math.min(2,npcs.length,freeSeats.length);i++){
    const idx=Math.floor(Math.random()*freeSeats.length);
    const seat=freeSeats.splice(idx,1)[0];
    placeNPCSeated(npcs[i],seat);
  }

  for(let i=2;i<npcs.length;i++){
    npcs[i].target=randomWalkTarget(npcs[i]);
    npcs[i].state='walking';
    playNPC(npcs[i],'Avatar_Walk',0);
  }
}

function npcCandidateBlocked(npc,candidate,minDistance=NPC_MIN_DISTANCE){
  if(avatarRoot&&avatarRoot.position.distanceTo(candidate)<minDistance)return true;

  for(const other of npcs){
    if(other===npc)continue;
    if(other.root.position.distanceTo(candidate)<minDistance)return true;
  }
  return false;
}

function playerCandidateBlocked(candidate,minDistance=.64){
  return npcs.some(n=>n.root.position.distanceTo(candidate)<minDistance);
}

function updateNPCs(dt,now){
  for(const npc of npcs){
    npc.mixer.update(dt);

    if(npc.state==='seated'){
      if(now>=npc.stateUntil){
        releaseSeat(npc);
        npc.state='idle';
        npc.stateUntil=now+THREE.MathUtils.randFloat(1.5,4.0);
        playNPC(npc,'Avatar_Idle');
      }
      continue;
    }

    if(npc.state==='idle'){
      if(now>=npc.stateUntil){
        if(Math.random()<0.48&&seatSlots.length&&reserveRandomSeat(npc)){
          // seat reserved; walk to it
        }else{
          npc.target=randomWalkTarget(npc);
          npc.state='walking';
          playNPC(npc,'Avatar_Walk');
        }
      }
      continue;
    }

    if(npc.state==='walking'||npc.state==='goingToSeat'){
      if(!npc.target){
        npc.state='idle';
        npc.stateUntil=now+2;
        playNPC(npc,'Avatar_Idle');
        continue;
      }

      const dir=npc.target.clone().sub(npc.root.position);
      dir.y=0;
      const distance=dir.length();

      if(distance<.10){
        if(npc.state==='goingToSeat'&&npc.seat){
          npc.root.position.copy(npc.seat.position);
          npc.root.rotation.y=Math.atan2(npc.seat.faceDir.x,npc.seat.faceDir.z)+MODEL_YAW_CORRECTION;
          npc.state='seated';
          npc.stateUntil=now+THREE.MathUtils.randFloat(7,15);
          npc.target=null;
          playNPC(npc,'Avatar_Sit');
        }else{
          npc.state='idle';
          npc.stateUntil=now+THREE.MathUtils.randFloat(1.5,5.0);
          npc.target=null;
          playNPC(npc,'Avatar_Idle');
        }
        continue;
      }

      dir.normalize();
      const step=Math.min(npc.speed*dt,distance);
      const candidate=npc.root.position.clone().addScaledVector(dir,step);

      if(npcCandidateBlocked(npc,candidate)){
        if(npc.state==='goingToSeat'){
          // Give way briefly instead of abandoning a reserved seat.
          playNPC(npc,'Avatar_Idle');
        }else{
          npc.target=randomWalkTarget(npc);
        }
        continue;
      }

      npc.root.position.copy(candidate);
      npc.root.rotation.y=Math.atan2(dir.x,dir.z)+MODEL_YAW_CORRECTION;
      playNPC(npc,'Avatar_Walk');
    }
  }
}

function updateCamera(){
  if(!avatarRoot)return;

  const avatarFocus=new THREE.Vector3(
    avatarRoot.position.x,
    avatarRoot.position.y+1.15,
    avatarRoot.position.z
  );

  // Loose follow. Camera orientation never changes because of movement.
  const dx=avatarFocus.x-cameraFocus.x;
  const dz=avatarFocus.z-cameraFocus.z;
  const dist=Math.hypot(dx,dz);
  const DEAD_ZONE=1.45;

  if(dist>DEAD_ZONE){
    const excess=dist-DEAD_ZONE;
    cameraFocus.x += (dx/dist)*excess;
    cameraFocus.z += (dz/dist)*excess;
  }

  cameraFocus.y=1.15;
  camTarget.copy(cameraFocus);

  const horizontalDir=new THREE.Vector2(Math.sin(camYaw),Math.cos(camYaw)).normalize();

  // Preserve camera angle while keeping camera inside pavilion.
  // Solve ray-circle intersection from camera focus along view offset.
  const fx=camTarget.x, fz=camTarget.z;
  const dx2=horizontalDir.x, dz2=horizontalDir.y;
  const b=2*(fx*dx2+fz*dz2);
  const cc=fx*fx+fz*fz-CAMERA_RADIUS*CAMERA_RADIUS;
  const disc=Math.max(0,b*b-4*cc);
  const maxHorizontal=(-b+Math.sqrt(disc))/2;

  const requestedHorizontal=Math.cos(camPitch)*camDistance;
  const horizontal=Math.max(.35,Math.min(requestedHorizontal,maxHorizontal-.08));

  const desired=new THREE.Vector3(
    camTarget.x+dx2*horizontal,
    camTarget.y+Math.sin(camPitch)*camDistance,
    camTarget.z+dz2*horizontal
  );

  desired.y=THREE.MathUtils.clamp(desired.y,1.25,4.45);

  camera.position.copy(desired);
  camera.lookAt(camTarget);
}

function setClickTarget(clientX,clientY){
  if(!avatarRoot)return;

  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hit=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(groundPlane,hit))return;

  // Ignore clicks outside pavilion instead of snapping to outer edge.
  if(Math.hypot(hit.x,hit.z)>WALK_RADIUS){
    status.textContent='파빌리온 안쪽 바닥을 클릭해 주세요';
    return;
  }

  moveTarget=new THREE.Vector3(hit.x,avatarRoot.position.y,hit.z);
  playAvatar('Avatar_Walk');
  status.textContent='이동 중 → '+hit.x.toFixed(1)+', '+hit.z.toFixed(1);
}

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  pointerDown=true;
  dragged=false;
  downX=lastX=e.clientX;
  downY=lastY=e.clientY;
  renderer.domElement.setPointerCapture?.(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!pointerDown)return;

  const total=Math.hypot(e.clientX-downX,e.clientY-downY);
  if(total>7)dragged=true;

  if(dragged){
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    camYaw-=dx*.006;
    camPitch=THREE.MathUtils.clamp(camPitch+dy*.004,.42,1.16);
  }

  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',e=>{
  if(e.button!==0)return;

  if(pointerDown&&!dragged){
    setClickTarget(e.clientX,e.clientY);
  }

  pointerDown=false;
  renderer.domElement.releasePointerCapture?.(e.pointerId);
});

renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  camDistance=THREE.MathUtils.clamp(camDistance+e.deltaY*.006,1.8,7.2);
  camera.fov=THREE.MathUtils.clamp(camera.fov+e.deltaY*.018,32,68);
  camera.updateProjectionMatrix();
},{passive:false});

addEventListener('keydown',e=>{
  if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
    keys.add(e.code);
    e.preventDefault();
  }
});
addEventListener('keyup',e=>keys.delete(e.code));

function updateMovement(dt){
  if(!avatarRoot)return;

  const f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  const s=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);

  const dir=new THREE.Vector3();
  let manual=!!(f||s);

  if(manual){
    moveTarget=null;

    // Camera-relative controls from the ACTUAL rendered camera.
    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();

    dir.addScaledVector(forward,f);
    dir.addScaledVector(right,s);
    if(dir.lengthSq()>0)dir.normalize();
  }else if(moveTarget){
    dir.copy(moveTarget).sub(avatarRoot.position);
    dir.y=0;

    const distance=dir.length();
    if(distance<.09){
      avatarRoot.position.x=moveTarget.x;
      avatarRoot.position.z=moveTarget.z;
      moveTarget=null;
      playAvatar('Avatar_Idle');
      return;
    }

    dir.normalize();
  }else{
    if(currentAction===avatarActions['Avatar_Walk'])playAvatar('Avatar_Idle');
    return;
  }

  setAvatarFacing(dir);

  let step=MOVE_SPEED*dt;
  if(moveTarget){
    const remaining=avatarRoot.position.distanceTo(moveTarget);
    step=Math.min(step,remaining);
  }

  const next=avatarRoot.position.clone().addScaledVector(dir,step);
  clampXZ(next,WALK_RADIUS);

  // Do not let the player walk through residents.
  if(playerCandidateBlocked(next)){
    if(moveTarget)moveTarget=null;
    playAvatar('Avatar_Idle');
    return;
  }

  avatarRoot.position.copy(next);
  playAvatar('Avatar_Walk');
}

Promise.all([
  loadGLB('./models/atelier_environment_web.glb'),
  loadGLB('./models/avatar_01.glb'),
  loadGLB('./models/atelier_furniture.glb').catch(()=>null),
  loadGLB('./models/atelier_upper_lower_flower.glb').catch(()=>null),
  loadGLB('./models/atelier_boat.glb').catch(()=>null)
]).then(([envGLB,avGLB,furnitureGLB,flowerGLB,boatGLB])=>{
  enhanceMaterials(envGLB.scene);
  scene.add(envGLB.scene);

  if(envGLB.animations?.length){
    envMixer=new THREE.AnimationMixer(envGLB.scene);
    envGLB.animations.forEach(clip=>{
      const a=envMixer.clipAction(clip);
      a.setLoop(THREE.LoopRepeat,Infinity);
      a.play();
    });
  }

  if(furnitureGLB){
    enhanceMaterials(furnitureGLB.scene);
    scene.add(furnitureGLB.scene);
  }

  if(flowerGLB){
    enhanceMaterials(flowerGLB.scene);
    scene.add(flowerGLB.scene);
  }

  if(boatGLB){
    enhanceMaterials(boatGLB.scene);
    scene.add(boatGLB.scene);

    boatMover=boatGLB.scene.getObjectByName('EXT Boat 0');
    if(boatMover){
      boatMover.getWorldPosition(boatPrevPos);
      boatHasPrev=true;
    }

    if(boatGLB.animations?.length){
      boatMixer=new THREE.AnimationMixer(boatGLB.scene);
      boatMixer.timeScale=1/3;
      boatGLB.animations.forEach(sourceClip=>{
        const clip=correctBoatClip(sourceClip);
        const a=boatMixer.clipAction(clip);
        a.setLoop(THREE.LoopRepeat,Infinity);
        a.play();
      });
    }
  }

  // Outer transform group controls movement/facing.
  avatarRoot=new THREE.Group();
  avatarRoot.position.set(0,0,-2.35);
  scene.add(avatarRoot);

  avatarModel=avGLB.scene;
  enhanceMaterials(avatarModel);
  avatarRoot.add(avatarModel);
  normalizeAvatarOrigin(avatarModel);

  avatarMixer=new THREE.AnimationMixer(avatarModel);
  avGLB.animations.forEach(clip=>{
    avatarActions[clip.name]=avatarMixer.clipAction(clip);
  });

  playAvatar('Avatar_Idle',0);

  // Build real stool seat anchors from the uploaded furniture GLB,
  // then create independent residents from the same rigged avatar.
  if(furnitureGLB)collectSeatSlots(furnitureGLB.scene);
  spawnNPCs(avatarModel,avGLB.animations,NPC_COUNT);

  cameraFocus.set(
    avatarRoot.position.x,
    avatarRoot.position.y+1.15,
    avatarRoot.position.z
  );
  camTarget.copy(cameraFocus);
  updateCamera();

  loading.style.display='none';
  status.textContent='준비됨';
}).catch(err=>{
  console.error(err);
  loading.textContent='GLB 로드 실패';
  status.textContent=String(err);
});

function updateBoatFacing(){
  if(!boatMover)return;

  const current=new THREE.Vector3();
  boatMover.getWorldPosition(current);

  if(boatHasPrev){
    const dx=current.x-boatPrevPos.x;
    const dz=current.z-boatPrevPos.z;
    const lenSq=dx*dx+dz*dz;

    if(lenSq>0.000001){
      // Boat bow in exported GLB points along local +X.
      // Rotate +X to the current XZ travel direction.
      boatMover.rotation.y=Math.atan2(-dz,dx);
    }
  }

  boatPrevPos.copy(current);
  boatHasPrev=true;
}

function tick(){
  requestAnimationFrame(tick);

  const dt=Math.min(clock.getDelta(),.05);

  if(avatarMixer)avatarMixer.update(dt);
  updateNPCs(dt,performance.now()/1000);
  if(envMixer)envMixer.update(dt);
  if(boatMixer){
    boatMixer.update(dt);
    updateBoatFacing();
  }

  // Subtle water movement when a normal map exists.
  scene.traverse(o=>{
    const waterMaterial=o.userData?.waterMaterial;
    if(waterMaterial?.normalMap){
      waterMaterial.normalMap.offset.x=(waterMaterial.normalMap.offset.x+dt*0.012)%1;
      waterMaterial.normalMap.offset.y=(waterMaterial.normalMap.offset.y+dt*0.007)%1;
    }
  });

  updateMovement(dt);
  updateCamera();

  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
