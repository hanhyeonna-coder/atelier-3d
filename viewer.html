<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atelier GLB Viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9e6ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0}
#hud{position:fixed;left:18px;top:18px;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);padding:12px 14px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-size:13px;color:#3e332d}
#hud b{display:block;margin-bottom:6px}
#status{font-size:12px;opacity:.75}
#actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#actions button{border:0;border-radius:10px;padding:7px 10px;background:#725640;color:white;cursor:pointer}
#actions button:hover{filter:brightness(1.08)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe8df;z-index:20;color:#49392f;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">아틀리에 불러오는 중…</div>
<div id="hud">
  <b>Atelier</b>
  <div>바닥 클릭 이동 · WASD / 방향키 직접 이동 · 드래그 시점 · 휠 줌</div>
  <div id="status">준비 중</div>
  <div id="actions">
    <button data-action="Avatar_Idle">Idle</button>
    <button data-action="Avatar_Walk">Walk</button>
    <button data-action="Avatar_Sit">Sit</button>
    <button data-action="Avatar_Paint">Paint</button>
  </div>
</div>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const app=document.getElementById('app');
const loading=document.getElementById('loading');
const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdceaf2);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,300);
camera.position.set(0,2.2,-6.5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff7ed,0x73879a,1.65));

const sun=new THREE.DirectionalLight(0xffddb0,4.2);
sun.position.set(-8,11,-4);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=0.5;
sun.shadow.camera.far=40;
sun.shadow.camera.left=-10;
sun.shadow.camera.right=10;
sun.shadow.camera.top=10;
sun.shadow.camera.bottom=-10;
sun.shadow.bias=-0.00035;
scene.add(sun);

const softFill=new THREE.DirectionalLight(0xbfdcff,1.0);
softFill.position.set(7,5,6);
scene.add(softFill);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.15,0);
controls.enableDamping=true;
controls.enablePan=false;
controls.enableZoom=true;
controls.minDistance=2.4;
controls.maxDistance=5.2;
controls.minPolarAngle=0.72;
controls.maxPolarAngle=1.42;

const loader=new GLTFLoader();
const clock=new THREE.Clock();

let environment=null;
let furniture=null;
let interiorDecor=null;
let boatScene=null;
let avatar=null;
let mixer=null;
let actions={};
let current=null;
let clickTarget=null;

const floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const raycaster=new THREE.Raycaster();
const pointerNdc=new THREE.Vector2();
let pointerDownX=0, pointerDownY=0, pointerDownTime=0;

function loadGLB(url){
  return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
}


function fitEnvironment(root){
  const box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  // Blender pavilion is authored around world origin; only correct obvious export offsets.
  if(center.length()>50) root.position.sub(center);
}

function enhanceSceneMaterials(root){
  root.traverse(o=>{
    if(!o.isMesh)return;

    o.castShadow=true;
    o.receiveShadow=true;

    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.filter(Boolean).forEach(mat=>{
      const label=((mat.name||'')+' '+(o.name||'')).toLowerCase();

      // Restore the glass-dome feeling that Blender viewport had.
      if(label.includes('glass') || label.includes('dome')){
        mat.transparent=true;
        mat.opacity=Math.min(mat.opacity ?? 1,0.26);
        mat.roughness=0.08;
        mat.metalness=0.0;
        if('transmission' in mat) mat.transmission=0.72;
        if('thickness' in mat) mat.thickness=0.08;
        if('ior' in mat) mat.ior=1.45;
        mat.envMapIntensity=1.8;
        mat.side=THREE.DoubleSide;
        mat.depthWrite=false;
        mat.needsUpdate=true;
      }else{
        if('envMapIntensity' in mat) mat.envMapIntensity=Math.max(mat.envMapIntensity||0,0.65);
      }
    });
  });
}

function clampCameraInside(){
  // Never allow the camera to leave the pavilion interior.
  const CAMERA_RADIUS=4.75;
  const r=Math.hypot(camera.position.x,camera.position.z);
  if(r>CAMERA_RADIUS){
    const s=CAMERA_RADIUS/r;
    camera.position.x*=s;
    camera.position.z*=s;
  }
  camera.position.y=THREE.MathUtils.clamp(camera.position.y,1.25,4.6);

  const TARGET_RADIUS=4.55;
  const tr=Math.hypot(controls.target.x,controls.target.z);
  if(tr>TARGET_RADIUS){
    const s=TARGET_RADIUS/tr;
    controls.target.x*=s;
    controls.target.z*=s;
  }
  controls.target.y=THREE.MathUtils.clamp(controls.target.y,0.8,2.1);
}

function play(name,fade=.18){
  const next=actions[name];
  if(!next){status.textContent='액션 없음: '+name;return;}
  if(current===next){
    if(!next.isRunning()) next.reset().play();
    return;
  }

  next.reset();
  next.enabled=true;
  next.clampWhenFinished=false;

  // Idle, Walk and Paint are continuous loops.
  if(name==='Avatar_Idle' || name==='Avatar_Walk' || name==='Avatar_Paint'){
    next.setLoop(THREE.LoopRepeat, Infinity);
    next.repetitions=Infinity;
  } else {
    next.setLoop(THREE.LoopRepeat, Infinity);
  }

  next.setEffectiveTimeScale(1).setEffectiveWeight(1).play();

  if(current && current!==next){
    current.crossFadeTo(next,fade,false);
  }

  current=next;
  status.textContent=name;
}

const keys=new Set();
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    keys.add(e.code); e.preventDefault();
  }
});
addEventListener('keyup',e=>keys.delete(e.code));

let pointerDragged=false;

renderer.domElement.addEventListener('pointerdown',e=>{
  pointerDownX=e.clientX;
  pointerDownY=e.clientY;
  pointerDragged=false;
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons){
    if(Math.hypot(e.clientX-pointerDownX,e.clientY-pointerDownY)>6){
      pointerDragged=true;
    }
  }
});

renderer.domElement.addEventListener('click',e=>{
  if(pointerDragged || !avatar) return;

  const rect=renderer.domElement.getBoundingClientRect();
  pointerNdc.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointerNdc.y=-((e.clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointerNdc,camera);
  const hit=new THREE.Vector3();

  if(!raycaster.ray.intersectPlane(floorPlane,hit)) return;

  const FLOOR_RADIUS=4.65;
  const radial=Math.hypot(hit.x,hit.z);
  if(radial>FLOOR_RADIUS){
    const s=FLOOR_RADIUS/radial;
    hit.x*=s;
    hit.z*=s;
  }

  hit.y=avatar.position.y;
  clickTarget=hit.clone();
  status.textContent='이동 중';
});

function updatePlayer(dt){
  if(!avatar)return;

  const forwardInput=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  const sideInput=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
  const keyboardMoving=!!(forwardInput||sideInput);

  const move=new THREE.Vector3();

  if(keyboardMoving){
    // Manual input cancels click-to-walk.
    clickTarget=null;

    const camForward=new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y=0;
    camForward.normalize();

    const camRight=new THREE.Vector3()
      .crossVectors(camForward,new THREE.Vector3(0,1,0))
      .normalize();

    move
      .addScaledVector(camForward,forwardInput)
      .addScaledVector(camRight,sideInput);

    if(move.lengthSq()>0) move.normalize();
  } else if(clickTarget){
    move.copy(clickTarget).sub(avatar.position);
    move.y=0;

    const distance=move.length();
    if(distance<0.08){
      avatar.position.x=clickTarget.x;
      avatar.position.z=clickTarget.z;
      clickTarget=null;
      play('Avatar_Idle');
      return;
    }
    move.normalize();
  } else {
    if(current===actions['Avatar_Walk']) play('Avatar_Idle');
    return;
  }

  const speed=2.0;
  const oldPosition=avatar.position.clone();

  let step=speed*dt;
  if(clickTarget){
    const remaining=avatar.position.distanceTo(clickTarget);
    step=Math.min(step,remaining);
  }

  const next=avatar.position.clone().addScaledVector(move,step);

  const FLOOR_RADIUS=4.65;
  const radial=Math.hypot(next.x,next.z);
  if(radial>FLOOR_RADIUS){
    const s=FLOOR_RADIUS/radial;
    next.x*=s;
    next.z*=s;
  }

  avatar.position.copy(next);

  // Face actual movement direction.
  avatar.rotation.y=Math.atan2(move.x,move.z)+Math.PI;
  play('Avatar_Walk');

  // Camera follows only by translation; it never auto-rotates.
  const delta=avatar.position.clone().sub(oldPosition);
  camera.position.add(delta);
  controls.target.add(delta);
}

Promise.all([
  loadGLB('./models/atelier_environment_web.glb'),
  loadGLB('./models/avatar_01.glb'),
  loadGLB('./models/atelier_furniture.glb').catch(()=>null),
  loadGLB('./models/atelier_upper_lower_flower.glb').catch(()=>null),
  loadGLB('./models/atelier_boat.glb').catch(()=>null)
]).then(([envGLB,avGLB,furnitureGLB,interiorDecorGLB,boatGLB])=>{
  environment=envGLB.scene;
fitEnvironment(environment);
  enhanceSceneMaterials(environment);
  scene.add(environment);

  if(furnitureGLB){
    furniture=furnitureGLB.scene;
    enhanceSceneMaterials(furniture);
    scene.add(furniture);
  }

  if(interiorDecorGLB){
    interiorDecor=interiorDecorGLB.scene;
    enhanceSceneMaterials(interiorDecor);
    scene.add(interiorDecor);
  }

  // Play every exported environment animation (boats etc.).
  if(envGLB.animations?.length){
    const envMixer=new THREE.AnimationMixer(environment);
    envGLB.animations.forEach(clip=>{
      const action=envMixer.clipAction(clip);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.clampWhenFinished=false;
      action.play();
    });
    scene.userData.envMixer=envMixer;
    console.log('Environment animations:', envGLB.animations.map(c=>c.name));
  }

  avatar=avGLB.scene;
  avatar.position.set(0,0,-2.6);
  enhanceSceneMaterials(avatar);
  scene.add(avatar);

  mixer=new THREE.AnimationMixer(avatar);
  avGLB.animations.forEach(clip=>actions[clip.name]=mixer.clipAction(clip));
  play(actions['Avatar_Idle']?'Avatar_Idle':Object.keys(actions)[0],0);

  console.log('Avatar actions:',Object.keys(actions));
  loading.style.display='none';
}).catch(err=>{
  console.error(err);
  loading.textContent='GLB 로드 실패 — models 폴더의 파일명을 확인해 주세요.';
  status.textContent=String(err);
});

document.querySelectorAll('[data-action]').forEach(b=>{
  b.onclick=()=>play(b.dataset.action);
});

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(mixer)mixer.update(dt);
  if(scene.userData.envMixer)scene.userData.envMixer.update(dt);
  if(scene.userData.boatMixer)scene.userData.boatMixer.update(dt);
  updatePlayer(dt);
  controls.update();
  clampCameraInside();
  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
