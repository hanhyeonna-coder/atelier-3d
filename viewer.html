<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atelier GLB Viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9e6ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0}
#hud{position:fixed;left:18px;top:18px;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);padding:12px 14px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-size:13px;color:#3e332d}
#hud b{display:block;margin-bottom:6px}
#status{font-size:12px;opacity:.75}
#actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#actions button{border:0;border-radius:10px;padding:7px 10px;background:#725640;color:white;cursor:pointer}
#actions button:hover{filter:brightness(1.08)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe8df;z-index:20;color:#49392f;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">아틀리에 불러오는 중…</div>
<div id="hud">
  <b>Atelier</b>
  <div>WASD / 방향키 이동 · 마우스 드래그 시점</div>
  <div id="status">준비 중</div>
  <div id="actions">
    <button data-action="Avatar_Idle">Idle</button>
    <button data-action="Avatar_Walk">Walk</button>
    <button data-action="Avatar_Sit">Sit</button>
    <button data-action="Avatar_Paint">Paint</button>
  </div>
</div>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const app=document.getElementById('app');
const loading=document.getElementById('loading');
const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdceaf2);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,300);
camera.position.set(12,-14,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x6d625c,2.3));
const sun=new THREE.DirectionalLight(0xfff0d4,3.1);
sun.position.set(-12,-8,18);sun.castShadow=true;scene.add(sun);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,1.7);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI*.49;

const loader=new GLTFLoader();
const clock=new THREE.Clock();

let environment=null;
let avatar=null;
let mixer=null;
let actions={};
let current=null;

function loadGLB(url){
  return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
}

function hideEmbeddedAvatar(root){
  const hideWords=['AtelierAvatarRig','AV ','AV_'];
  root.traverse(o=>{
    const n=o.name||'';
    if(hideWords.some(w=>n.startsWith(w)||n.includes(w))) o.visible=false;
  });
}

function fitEnvironment(root){
  const box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  // Blender pavilion is authored around world origin; only correct obvious export offsets.
  if(center.length()>50) root.position.sub(center);
}

function play(name,fade=.18){
  const next=actions[name];
  if(!next){status.textContent='액션 없음: '+name;return;}
  if(current===next)return;
  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).play();
  if(current) current.crossFadeTo(next,fade,false);
  current=next;
  status.textContent=name;
}

const keys=new Set();
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    keys.add(e.code); e.preventDefault();
  }
});
addEventListener('keyup',e=>keys.delete(e.code));

function updatePlayer(dt){
  if(!avatar)return;
  const forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  const side=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
  if(!forward&&!side){
    if(current===actions['Avatar_Walk']) play('Avatar_Idle');
    return;
  }
  const angle=Math.atan2(side,forward);
  avatar.rotation.y=angle;
  const speed=2.0;
  avatar.position.x+=Math.sin(angle)*speed*dt;
  avatar.position.z+=Math.cos(angle)*speed*dt;
  play('Avatar_Walk');
  controls.target.lerp(new THREE.Vector3(avatar.position.x,avatar.position.y+1.1,avatar.position.z),.05);
}

Promise.all([
  loadGLB('./models/atelier_environment.glb'),
  loadGLB('./models/avatar_01.glb')
]).then(([envGLB,avGLB])=>{
  environment=envGLB.scene;
  hideEmbeddedAvatar(environment);
  fitEnvironment(environment);
  scene.add(environment);

  // play only the boat animation from the environment file
  if(envGLB.animations?.length){
    const envMixer=new THREE.AnimationMixer(environment);
    const boatClip=envGLB.animations.find(c=>/Boat/i.test(c.name));
    if(boatClip){envMixer.clipAction(boatClip).play(); scene.userData.envMixer=envMixer;}
  }

  avatar=avGLB.scene;
  avatar.position.set(0,0,2.5);
  scene.add(avatar);

  mixer=new THREE.AnimationMixer(avatar);
  avGLB.animations.forEach(clip=>actions[clip.name]=mixer.clipAction(clip));
  play(actions['Avatar_Idle']?'Avatar_Idle':Object.keys(actions)[0],0);

  console.log('Avatar actions:',Object.keys(actions));
  loading.style.display='none';
}).catch(err=>{
  console.error(err);
  loading.textContent='GLB 로드 실패 — models 폴더의 파일명을 확인해 주세요.';
  status.textContent=String(err);
});

document.querySelectorAll('[data-action]').forEach(b=>{
  b.onclick=()=>play(b.dataset.action);
});

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(mixer)mixer.update(dt);
  if(scene.userData.envMixer)scene.userData.envMixer.update(dt);
  updatePlayer(dt);
  controls.update();
  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
